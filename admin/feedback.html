<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾间 · 反馈管理</title><link rel="stylesheet" href="/assets/app.css"><style>body{display:block;height:auto;overflow:auto;background:#f7f6f0;color:#343830;font-family:system-ui,sans-serif;margin:0;padding:24px}main{max-width:800px;margin:auto}article{background:white;padding:20px;margin:16px 0;border-radius:16px}img{max-width:100%;max-height:500px;object-fit:contain;display:block;margin:10px 0}textarea,input{box-sizing:border-box;max-width:100%;width:100%}p{white-space:pre-wrap;line-height:1.8}</style></head><body><main><h1>拾间 · 反馈管理</h1><p>仅管理用户主动提交的反馈。无法读取用户的本机日记和账本。</p><form id="auth"><label>管理凭证<input id="token" type="password" autocomplete="off" minlength="32" required></label><button class="primary-button" type="submit">查看反馈</button><button class="quiet-button" id="logout" type="button">清除当前凭证</button></form><p id="status" role="status"></p><div id="items"></div></main><script src="/assets/admin-feedback.js" defer></script></body></html>
