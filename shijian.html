<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 图标与全屏配置 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F6F2">
    
    <title>拾间</title>
       <script>
        const timelineContainer = document.getElementById('timelineContainer');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');
        const inputOverlay = document.getElementById('inputOverlay');
        const inputPanel = document.getElementById('inputPanel');
        let currentBase64Image = null; // 暂存当前选中的图片

        // 轻提示
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.cssText = "position:fixed; top:20%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:10px 20px; border-radius:20px; font-size:14px; z-index:9999; transition:opacity 0.3s;";
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
        }

        // 渲染时间流
        function renderTimeline() {
            const history = JSON.parse(localStorage.getItem('shijian_history') || '[]');
            const groupedByDay = {};
            
            history.forEach(item => {
                if (!item.time) return;
                const dateObj = new Date(item.time);
                const dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                if (!groupedByDay[dateStr]) groupedByDay[dateStr] = [];
                groupedByDay[dateStr].push(item);
            });

            timelineContainer.innerHTML = '';
            const sortedDates = Object.keys(groupedByDay).sort((a, b) => new Date(b) - new Date(a));
            
            if (sortedDates.length === 0) {
                timelineContainer.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin-top:80px; font-size:14px; letter-spacing:1px;">这里，留给你的日常。</div>';
                return;
            }

            sortedDates.forEach(dateStr => {
                const dayData = groupedByDay[dateStr];
                const dateObj = new Date(dateStr);
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = `${dateObj.getMonth() + 1}月`;
                
                const aiReply = dayData.find(d => d.role === 'ai' && d.type === 'text');
                const userImage = dayData.find(d => d.role === 'user' && d.type === 'image');
                const userText = dayData.find(d => d.role === 'user' && d.type === 'text');

                let title = "今日留白";
                let bodyText = "这一天没有留下文字，只在时光里安静地流淌。";
                
                if (aiReply) {
                    const textLines = aiReply.content.split('\n').filter(l => l.trim() !== '');
                    title = textLines[0].substring(0, 12) + (textLines[0].length > 12 ? '...' : '');
                    bodyText = aiReply.content;
                } else if (userText) {
                    title = "碎碎念";
                    bodyText = userText.content;
                }

                let imgHtml = userImage ? `<img src="${userImage.content}" class="content-image">` : '';

                const groupDiv = document.createElement('div');
                groupDiv.className = 'day-group';
                groupDiv.onclick = () => openModal(dateStr, dayData);

                groupDiv.innerHTML = `
                    <div class="date-side">
                        <div class="date-num">${day}</div>
                        <div class="date-month">${month}</div>
                    </div>
                    <div class="timeline-track"><div class="dot"></div></div>
                    <div class="content-side">
                        <h3 class="content-title">${title}</h3>
                        ${imgHtml}
                        <p class="content-text">${bodyText}</p>
                    </div>
                `;
                timelineContainer.appendChild(groupDiv);
            });
        }

        window.onload = function() { renderTimeline(); };

        // ================= 输入面板交互 =================
        function openInputPanel() {
            inputOverlay.classList.add('show');
            inputPanel.classList.add('show');
            setTimeout(() => messageInput.focus(), 300);
        }

        function closeInputPanel() {
            inputOverlay.classList.remove('show');
            inputPanel.classList.remove('show');
            messageInput.value = '';
            currentBase64Image = null;
        }

        // 图片选择
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("图片太大了，请选择5MB以内的图片哦～");
                imageInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                currentBase64Image = event.target.result;
                showToast("图片已附加");
            };
            reader.readAsDataURL(file);
            imageInput.value = ''; 
        });

        // 保存记录
        async function saveRecord() {
            const text = messageInput.value.trim();
            if (!text && !currentBase64Image) return;

            closeInputPanel();
            
            if (text) saveToHistory('text', 'user', text);
            if (currentBase64Image) saveToHistory('image', 'user', currentBase64Image);
            
            showToast("拾间正在感受...");

            let contentArray = [];
            if (text) contentArray.push({ type: "text", text: text });
            if (currentBase64Image) contentArray.push({ type: "image_url", image_url: { url: currentBase64Image } });
            
            // 如果有图片，加一句提示词
            if (currentBase64Image && !text) {
                contentArray.unshift({ type: "text", text: "请看看这张图片，提取场景或感受意境，写一段时光切片。" });
            }

            await callAI(contentArray);
            renderTimeline();
        }

        async function callAI(contentArray) {
            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "glm-4v", messages: [{ role: "user", content: contentArray }] })
                });
                
                if (!response.ok) throw new Error("网络请求失败");
                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    saveToHistory('text', 'ai', data.choices[0].message.content); 
                }
            } catch (error) {
                console.error(error);
                showToast("⚠️ 反应超时了，请重试"); 
            }
        }

        function saveToHistory(type, role, content) {
            const history = JSON.parse(localStorage.getItem('shijian_history') || '[]');
            history.push({ type, role, content, time: new Date().toISOString() });
            localStorage.setItem('shijian_history', JSON.stringify(history));
        }

        function exportData() {
            const history = JSON.parse(localStorage.getItem('shijian_history') || '[]');
            if (history.length === 0) return alert("现在还是纯白的留白，没有任何记录可以导出哦。");

            let textContent = "【拾间 · 我的时光切片】\n\n";
            history.sort((a, b) => new Date(a.time) - new Date(b.time)).forEach(item => {
                const dateStr = new Date(item.time).toLocaleString();
                if (item.type === 'text') {
                    textContent += `[${dateStr}] ${item.role === 'user' ? '【我】' : '【拾间】'}：${item.content}\n`;
                } else if (item.type === 'image') {
                    textContent += `[${dateStr}] 【我】：（上传了一张图片/截图）\n`;
                }
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `拾间_时光流_${new Date().toLocaleDateString()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ================= 方案A：单日卡片全屏展开 =================
        function openModal(dateStr, dayData) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            const dateObj = new Date(dateStr);
            const dateTitle = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;

            const aiReply = dayData.find(d => d.role === 'ai' && d.type === 'text');
            const userImage = dayData.find(d => d.role === 'user' && d.type === 'image');
            
            let html = `<div style="display:flex; justify-content:flex-end; margin-bottom:20px;"><div style="font-size:20px; color:var(--text-sub); cursor:pointer;" onclick="closeModal()">✕</div></div>`;
            html += `<div style="background-color:#FFF; border-radius:12px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.03);">
                        <div style="font-size:12px; color:var(--text-sub); margin-bottom:8px; letter-spacing:1px;">${dateTitle}</div>
                        <h2 style="font-family:'KaiTi'; font-size:24px; margin:0 0 20px 0;">${aiReply ? aiReply.content.split('\n')[0].substring(0,15) : '今日留白'}</h2>`;
            
            if (userImage) html += `<img src="${userImage.content}" style="width:100%; border-radius:8px; margin-bottom:20px;">`;
            html += `<p style="font-size:15px; color:#333; line-height:1.8; margin:0;">${aiReply ? aiReply.content : '这一天没有文字记录。'}</p></div>`;

            content.innerHTML = html;
            modal.style.display = 'block';
            content.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            document.getElementById('modalContent').style.display = 'none';
        }
    </script>

                    <span>图片</span>
                </div>
                <div class="media-btn" onclick="alert('语音功能正在开发中，敬请期待～')">
                    <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    <span>语音</span>
                </div>
            </div>
            <button class="save-btn" onclick="saveRecord()">保存</button>
        </div>
    </div>
