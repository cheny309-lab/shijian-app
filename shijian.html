<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拾间</title>
    
    <style>
        /* ========================================================
           模块 1：全局样式与时间轴（纯展示）
           ======================================================== */
        :root { --bg-color: #F7F6F2; --text-main: #2C2C2C; --text-sub: #999999; --sage-green: #8DA38E; --line-color: #E8E6E1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; color: var(--text-main); overflow: hidden; }
        .header { padding: 24px 24px 10px 24px; display: flex; justify-content: space-between; align-items: flex-start; }
        .header-left h1 { font-family: "KaiTi", "STKaiti", serif; font-size: 26px; font-weight: 600; margin: 0 0 6px 0; letter-spacing: 2px; }
        .header-left p { font-size: 12px; color: var(--text-sub); margin: 0; }
        .header-right { font-size: 20px; cursor: pointer; opacity: 0.8; padding: 5px; }
        .timeline-container { flex: 1; overflow-y: auto; padding: 10px 24px 120px 24px; }
        .day-group { display: flex; margin-bottom: 36px; cursor: pointer; }
        .date-side { width: 45px; flex-shrink: 0; padding-top: 2px; }
        .date-num { font-size: 20px; line-height: 1; }
        .date-month { font-size: 10px; color: var(--text-sub); margin-top: 4px; }
        .timeline-track { width: 20px; flex-shrink: 0; position: relative; display: flex; justify-content: center; }
        .timeline-track::before { content: ''; position: absolute; top: 10px; bottom: -45px; width: 1px; background-color: var(--line-color); z-index: 1; }
        .day-group:last-child .timeline-track::before { display: none; }
        .dot { width: 5px; height: 5px; background-color: var(--sage-green); border-radius: 50%; margin-top: 8px; z-index: 2; position: relative; }
        .content-side { flex: 1; padding-left: 8px; }
        .content-title { font-family: "KaiTi", "STKaiti", serif; font-size: 18px; margin: 0 0 8px 0; }
        .content-text { font-size: 14px; color: #555; line-height: 1.6; margin: 0 0 12px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .content-image { width: 100%; max-width: 200px; border-radius: 6px; margin-bottom: 12px; display: block; object-fit: cover; }

        /* ========================================================
           模块 2：底部导航与输入面板
           ======================================================== */
        .bottom-container { position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); background-color: var(--bg-color); z-index: 100; }
        .record-btn-wrapper { display: flex; justify-content: center; margin-bottom: 15px; }
        .record-btn { background-color: var(--sage-green); color: white; border: none; padding: 12px 28px; border-radius: 30px; font-size: 15px; font-weight: 500; box-shadow: 0 4px 12px rgba(141, 163, 142, 0.3); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 10px 0 15px 0; border-top: 1px solid #EBEAE6; background-color: var(--bg-color); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); cursor: pointer; }
        .nav-item.active { color: var(--text-main); }
        .icon-home { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; margin-bottom: 4px; }
        .icon-home::before { content: ''; position: absolute; top: -4px; left: 2px; width: 10px; height: 10px; border-top: 1.5px solid currentColor; border-left: 1.5px solid currentColor; transform: rotate(45deg); background-color: var(--bg-color); }
        .icon-list { width: 16px; height: 18px; border: 1.5px solid currentColor; border-radius: 2px; position: relative; margin-bottom: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
        .icon-list::before, .icon-list::after { content: ''; width: 8px; height: 1px; background-color: currentColor; }
        .icon-user { width: 16px; height: 16px; border: 1.5px solid currentColor; border-radius: 50%; position: relative; margin-bottom: 4px; }
        .icon-user::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 20px; height: 10px; border-top: 1.5px solid currentColor; border-radius: 10px 10px 0 0; }
        .input-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.4); z-index: 200; }
        .input-overlay.show { display: block; }
        .input-panel { position: fixed; bottom: -100%; left: 0; right: 0; background-color: var(--bg-color); border-radius: 20px 20px 0 0; padding: 20px 24px; z-index: 201; transition: bottom 0.3s; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .input-panel.show { bottom: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .panel-header h3 { font-family: "KaiTi", "STKaiti", serif; font-size: 18px; margin: 0; }
        .close-btn { font-size: 20px; color: var(--text-sub); cursor: pointer; padding: 5px; }
        .textarea-box { width: 100%; height: 120px; background-color: #FFFFFF; border: 1px solid #EFEFEF; border-radius: 12px; padding: 15px; font-size: 15px; outline: none; resize: none; margin-bottom: 20px; font-family: inherit; }
        .panel-actions { display: flex; justify-content: space-between; align-items: center; }
        .media-btns { display: flex; gap: 20px; }
        .media-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); cursor: pointer; gap: 4px; }
        .media-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .save-btn { background-color: var(--sage-green); color: white; border: none; padding: 10px 24px; border-radius: 20px; font-size: 15px; cursor: pointer; }

        /* ========================================================
           模块 3：详情弹窗与报错面板
           ======================================================== */
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-color); z-index: 300; overflow-y: auto; padding: 24px; }
        .detail-overlay.show { display: block; }
        .detail-card { background-color: #FFF; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .detail-date { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
        .detail-title { font-family: "KaiTi", "STKaiti", serif; font-size: 24px; margin: 0 0 20px 0; }
        .detail-image { width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .detail-text { font-size: 15px; color: #333; line-height: 1.8; margin: 0; }
        #debug-panel { display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.9); color:#ff5555; padding:15px; font-size:12px; z-index:99999; max-height:30vh; overflow-y:auto; font-family:monospace; white-space:pre-wrap; }

        /* 模块 7：交互状态、图片预览与按记录显示，保留原有视觉风格 */
        .input-panel { bottom:var(--keyboard-inset,0px); transform:translateY(110%); visibility:hidden; pointer-events:none; transition:transform .25s,visibility .25s; max-height:85vh; max-height:85dvh; overflow-y:auto; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
        .input-panel.show { bottom:var(--keyboard-inset,0px); transform:translateY(0); visibility:visible; pointer-events:auto; }
        .panel-open .bottom-container { visibility:hidden; pointer-events:none; }
        .textarea-box { font-size:16px; }
        .save-btn:disabled { opacity:.55; cursor:wait; }
        #imagePreview { margin:0 0 16px; }
        #imagePreview[hidden] { display:none; }
        #imagePreviewImage { max-width:100%; max-height:180px; border-radius:8px; display:block; }
        #removeImageButton,.retry-btn { margin-top:8px; border:1px solid var(--line-color); background:transparent; border-radius:16px; color:#526853; padding:7px 12px; cursor:pointer; }
        .record-item { margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--line-color); overflow-wrap:anywhere; }
        .record-item:last-child { margin-bottom:0; border-bottom:0; }
        .record-status { color:#666; font-size:12px; line-height:1.7; margin:8px 0; }
        .content-text,.detail-text { white-space:pre-wrap; }
        .detail-label { margin:20px 0 8px; color:#666; font-size:12px; }
        .empty-state { text-align:center; color:#777; margin-top:80px; }
        #toast { position:fixed; left:50%; top:18%; transform:translateX(-50%); max-width:88%; background:#333; color:#fff; border-radius:14px; padding:12px 18px; font-size:14px; line-height:1.6; z-index:9999; }
        #storageNotice { margin:0 24px 10px; padding:10px 12px; border:1px solid #d6ceba; border-radius:8px; font-size:13px; line-height:1.6; color:#60573f; }
        .export-button { font:inherit; font-size:12px; color:#526853; border:1px solid var(--line-color); background:transparent; padding:8px; border-radius:12px; cursor:pointer; }
        .timeline-container { padding-bottom:calc(170px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body>

    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="storageNotice" role="status" hidden></div>

    <!-- 模块 A：顶部与时间轴 -->
    <div class="header">
        <div class="header-left"><h1>拾间</h1><p id="currentMonth">时光</p></div>
        <button class="export-button" id="exportButton" type="button" aria-label="导出本机记录备份">导出备份</button>
    </div>
    <div class="timeline-container" id="timelineContainer"></div>

    <!-- 模块 B：底部导航栏 -->
    <div class="bottom-container">
        <div class="record-btn-wrapper">
            <button class="record-btn" onclick="openInputPanel()"><span>＋</span> 留下此刻</button>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active"><div class="icon-home"></div>时光</div>
            <div class="nav-item"><div class="icon-list"></div>账单</div>
            <div class="nav-item"><div class="icon-user"></div>我的</div>
        </div>
    </div>

    <!-- 模块 C：输入面板 -->
    <div class="input-overlay" id="inputOverlay" onclick="closeInputPanel()"></div>
    <div class="input-panel" id="inputPanel" role="dialog" aria-modal="true" aria-label="留下此刻" aria-hidden="true">
        <div class="panel-header"><h3>留下此刻</h3><div class="close-btn" onclick="closeInputPanel()">✕</div></div>
        <textarea class="textarea-box" id="messageInput" aria-label="记录文字" maxlength="8000" placeholder="今晚加班到很晚，吃了一顿烧烤。"></textarea>
        <div id="imagePreview" hidden><img id="imagePreviewImage" alt="待保存图片"><button id="removeImageButton" type="button">移除图片</button></div>
        <div class="panel-actions">
            <div class="media-btns">
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <div class="media-btn" onclick="document.getElementById('imageInput').click()">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg><span>图片</span>
                </div>
            </div>
            <button id="saveButton" type="button" class="save-btn" onclick="saveRecord()" disabled>保存</button>
        </div>
    </div>

    <!-- 模块 D：详情弹窗 -->
    <div class="detail-overlay" id="detailModal">
        <div style="display:flex; justify-content:flex-end; margin-bottom:20px;">
            <div style="font-size:20px; color:var(--text-sub); cursor:pointer; padding:5px;" onclick="closeModal()">✕</div>
        </div>
        <div id="modalContent"></div>
    </div>

<script>
/* 拾间客户端：模块之间通过明确的方法调用，不依赖共享的临时图片变量。 */
(function () {
    'use strict';
    const VERSION = '2026.10.25-fix1';

    // 模块 1：持久化。文字、图片、AI状态作为同一条记录原子保存。
    const Storage = (() => {
        let db;
        function request(storeName, mode, operation) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, mode);
                let req;
                try { req = operation(tx.objectStore(storeName)); }
                catch (error) { tx.abort(); reject(error); return; }
                tx.oncomplete = () => resolve(req && req.result);
                tx.onerror = () => reject(tx.error || new Error('保存失败'));
                tx.onabort = () => reject(tx.error || new Error('保存已中止'));
            });
        }
        function legacyRecords(items) {
            const result = [];
            let current = null;
            const finish = () => { if (current) result.push(current); current = null; };
            items.forEach((item, index) => {
                if (!item || typeof item.content !== 'string') return;
                const time = Number.isFinite(Date.parse(item.time)) ? new Date(item.time).toISOString() : new Date(0).toISOString();
                const fresh = () => ({ id: 'legacy-' + index, time, text: '', image: null, ai: '', aiStatus: 'idle', error: '', legacy: true });
                if (item.role === 'ai') {
                    if (!current) current = fresh();
                    current.ai = item.content;
                    current.aiStatus = 'done';
                    finish();
                } else {
                    const field = item.type === 'image' ? 'image' : 'text';
                    if (!current || current[field] || Math.abs(Date.parse(time) - Date.parse(current.time)) > 60000) {
                        finish(); current = fresh();
                    }
                    current[field] = item.content;
                }
            });
            finish();
            return result;
        }
        async function migrateLegacy() {
            let raw;
            try { raw = localStorage.getItem('shijian_history'); }
            catch (_) { return '旧版存储暂不可读，旧数据未删除。'; }
            if (!raw) return '';
            let legacy;
            try { legacy = JSON.parse(raw); if (!Array.isArray(legacy)) throw new Error(); }
            catch (_) { return '旧记录格式异常，已保留原数据；请先导出备份。'; }
            const records = legacyRecords(legacy);
            await new Promise((resolve, reject) => {
                const tx = db.transaction(['records', 'meta'], 'readwrite');
                const meta = tx.objectStore('meta');
                const check = meta.get('legacy-migrated');
                check.onsuccess = () => {
                    if (check.result) return;
                    records.forEach(record => tx.objectStore('records').put(record));
                    meta.put({ key: 'legacy-migrated', count: records.length });
                };
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error || new Error('旧数据迁移未完成'));
            });
            // 原 localStorage 留存，供回退与原始备份；新记录不再写入容量很小的 localStorage。
            return '';
        }
        async function init() {
            if (!window.indexedDB) throw new Error('当前浏览器无法保存记录，请换用支持本地存储的浏览器。');
            db = await new Promise((resolve, reject) => {
                const open = indexedDB.open('shijian_records_v2', 1);
                open.onupgradeneeded = () => {
                    const database = open.result;
                    if (!database.objectStoreNames.contains('records')) database.createObjectStore('records', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta', { keyPath: 'key' });
                };
                let blocked = false;
                open.onsuccess = () => {
                    if (blocked) { open.result.close(); return; }
                    open.result.onversionchange = () => open.result.close();
                    resolve(open.result);
                };
                open.onerror = () => reject(open.error);
                open.onblocked = () => { blocked = true; reject(new Error('请关闭其他拾间页面后重试。')); };
            });
            const warning = await migrateLegacy();
            return { warning, records: await request('records', 'readonly', store => store.getAll()) };
        }
        return { init, put: record => request('records', 'readwrite', store => store.put(record)) };
    })();

    // 模块 2：图片准备。限制最长边、不放大小图，并显式处理读取和解码失败。
    const Images = (() => {
        function prepare(file) {
            return new Promise((resolve, reject) => {
                if (file.size > 20 * 1024 * 1024) { reject(new Error('图片较大，请选择20MB以内的图片。')); return; }
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('图片未能读取，请重新选择。'));
                reader.onabort = () => reject(new Error('图片读取已取消。'));
                reader.onload = () => {
                    const image = new Image();
                    image.onerror = () => reject(new Error('图片格式暂不支持，请选择JPG、PNG或WebP。'));
                    image.onload = () => {
                        try {
                            const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
                            const context = canvas.getContext('2d');
                            if (!context) throw new Error('当前浏览器无法处理图片。');
                            context.fillStyle = '#fff'; context.fillRect(0, 0, canvas.width, canvas.height);
                            context.drawImage(image, 0, 0, canvas.width, canvas.height);
                            const data = canvas.toDataURL('image/jpeg', 0.82);
                            if (data.length > 3 * 1024 * 1024) throw new Error('压缩后图片仍较大，请裁剪后再试。');
                            resolve(data);
                        } catch (error) { reject(error); }
                    };
                    image.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }
        return { prepare };
    })();

    // 模块 3：AI接口。仅重试本条记录，不重复保存用户输入。
    const Api = (() => {
        async function generate(record) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 60000);
            const content = [];
            if (record.text) content.push({ type: 'text', text: record.text });
            if (record.image) content.push({ type: 'image_url', image_url: { url: record.image } });
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content }], recordId: record.id }),
                    signal: controller.signal
                });
                const data = await response.json().catch(() => null);
                if (!response.ok) {
                    const error = new Error((data && data.error && data.error.message) || (data && data.message) || 'AI服务暂不可用，请稍后重试。');
                    error.code = data && data.error && data.error.code || 'HTTP_' + response.status;
                    error.requestId = data && data.error && data.error.requestId;
                    throw error;
                }
                const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
                if (typeof text !== 'string' || !text.trim()) throw new Error('AI没有返回文字，可稍后重试。');
                return text.trim();
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('等待AI超时，原始记录已保存，可稍后重试。');
                if (error instanceof TypeError) throw new Error('网络连接中断，原始记录已保存，可稍后重试。');
                throw error;
            } finally { clearTimeout(timeout); }
        }
        return { generate };
    })();

    // 模块 4：应用状态。每次保存拥有独立ID，AI回复只更新对应记录。
    const State = { records: [], image: null, imageVersion: 0, imageLoading: false, saving: false, ready: false };
    const running = new Set();
    const el = id => document.getElementById(id);
    function node(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
    }
    let toastTimer;
    function toast(message) {
        el('toast').textContent = message;
        el('toast').hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el('toast').hidden = true; }, 4500);
    }
    function notice(message) { el('storageNotice').textContent = message; el('storageNotice').hidden = !message; }
    function storageMessage(error) {
        return error && error.name === 'QuotaExceededError'
            ? '设备存储空间不足，本次未保存，输入仍保留。请先导出备份或释放空间。'
            : '本次未能写入设备存储，输入仍保留。请导出已有记录，并检查浏览器存储设置。';
    }
    async function persist(record) {
        await Storage.put(record);
        const index = State.records.findIndex(item => item.id === record.id);
        if (index === -1) State.records.push(record); else State.records[index] = record;
    }
    function dateKey(time) {
        const d = new Date(time);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function safeImage(value) { return typeof value === 'string' && /^data:image\/(jpeg|jpg|png|webp|gif);base64,/i.test(value); }

    // 模块 5：渲染。每天展示全部记录；用户和AI内容只作为纯文本插入。
    function recordTitle(record) { return (record.text || (record.image ? '一张图片' : '时光切片')).split('\n')[0].slice(0, 18); }
    function renderTimeline() {
        const container = el('timelineContainer');
        container.replaceChildren();
        const grouped = new Map();
        [...State.records].reverse().sort((a, b) => Date.parse(b.time) - Date.parse(a.time)).forEach(record => {
            const key = dateKey(record.time);
            if (!grouped.has(key)) grouped.set(key, []);
            grouped.get(key).push(record);
        });
        if (!grouped.size) { container.append(node('p', 'empty-state', '这里，留给你的日常。')); return; }
        [...grouped.keys()].sort().reverse().forEach(key => {
            const records = grouped.get(key);
            const group = node('section', 'day-group');
            const date = node('div', 'date-side');
            date.append(node('div', 'date-num', key.slice(8)), node('div', 'date-month', Number(key.slice(5, 7)) + '月'));
            const track = node('div', 'timeline-track'); track.append(node('div', 'dot'));
            const content = node('div', 'content-side');
            records.forEach(record => {
                const card = node('article', 'record-item'); card.dataset.recordId = record.id;
                card.tabIndex = 0; card.setAttribute('role', 'button');
                card.append(node('h3', 'content-title', recordTitle(record)));
                if (safeImage(record.image)) { const image = node('img', 'content-image'); image.src = record.image; image.alt = '本条记录的图片'; image.loading = 'lazy'; card.append(image); }
                card.append(node('p', 'content-text', record.ai || record.text || '图片已留下，可点开查看。'));
                if (record.aiStatus === 'generating' || record.aiStatus === 'queued') card.append(node('p', 'record-status', '原始记录已保存 · 正在整理文字…'));
                if (record.aiStatus === 'failed') {
                    card.append(node('p', 'record-status', '原始记录已保存 · ' + (record.error || 'AI整理未完成')));
                    const retry = node('button', 'retry-btn', '重试AI整理'); retry.type = 'button';
                    retry.addEventListener('click', event => { event.stopPropagation(); runAI(record.id); });
                    card.append(retry);
                }
                card.addEventListener('click', () => openModal(record.id));
                card.addEventListener('keydown', event => { if (event.key === 'Enter') openModal(record.id); });
                content.append(card);
            });
            group.append(date, track, content); container.append(group);
        });
    }
    function openModal(id) {
        const record = State.records.find(item => item.id === id);
        if (!record) return;
        const root = el('modalContent'); root.replaceChildren();
        const card = node('div', 'detail-card');
        card.append(node('div', 'detail-date', new Date(record.time).toLocaleString()), node('h2', 'detail-title', recordTitle(record)));
        if (safeImage(record.image)) { const image = node('img', 'detail-image'); image.src = record.image; image.alt = '记录图片'; card.append(image); }
        if (record.text) card.append(node('p', 'detail-label', '本人记录'), node('p', 'detail-text', record.text));
        if (record.ai) card.append(node('p', 'detail-label', '时光切片'), node('p', 'detail-text', record.ai));
        if (record.error) card.append(node('p', 'record-status', record.error));
        if (record.errorCode || record.requestId) {
            const details = node('details', 'record-status'); details.append(node('summary', '', '查看错误详情'), node('p', '', [record.errorCode, record.requestId].filter(Boolean).join(' · '))); card.append(details);
        }
        root.append(card); el('detailModal').classList.add('show');
    }
    function closeModal() { el('detailModal').classList.remove('show'); }

    // 模块 6：面板和图片选择。关闭不清空草稿；真正保存成功后才清空。
    function updateSaveButton() {
        const button = el('saveButton');
        button.disabled = !State.ready || State.imageLoading || State.saving;
        button.textContent = State.saving ? '保存中…' : State.imageLoading ? '图片处理中…' : '保存';
    }
    function openInputPanel() {
        el('inputOverlay').classList.add('show'); el('inputPanel').classList.add('show');
        el('inputPanel').setAttribute('aria-hidden', 'false'); document.body.classList.add('panel-open');
    }
    function closeInputPanel() {
        el('inputOverlay').classList.remove('show'); el('inputPanel').classList.remove('show');
        el('inputPanel').setAttribute('aria-hidden', 'true'); document.body.classList.remove('panel-open');
        el('messageInput').blur();
    }
    function clearDraft() {
        el('messageInput').value = ''; State.image = null; State.imageVersion += 1;
        el('imageInput').value = ''; el('imagePreview').hidden = true; el('imagePreviewImage').removeAttribute('src');
    }
    async function onImageChange(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = ''; // 允许再次选择同一张图。
        if (!file) return;
        const version = ++State.imageVersion;
        State.imageLoading = true; updateSaveButton();
        try {
            const image = await Images.prepare(file);
            if (version !== State.imageVersion) return;
            State.image = image; el('imagePreviewImage').src = image; el('imagePreview').hidden = false;
        } catch (error) { if (version === State.imageVersion) toast(error.message); }
        finally { if (version === State.imageVersion) { State.imageLoading = false; updateSaveButton(); } }
    }

    // 模块 7：先可靠保存原始记录，再异步整理；重复点击和失败重试相互隔离。
    async function saveRecord() {
        if (State.saving) return;
        if (!State.ready) { toast('设备存储尚未就绪，输入会继续保留。'); return; }
        if (State.imageLoading) { toast('图片仍在处理中，请稍候。'); return; }
        const text = el('messageInput').value.trim();
        if (!text && !State.image) { toast('可以写一句话，或选择一张图片。'); return; }
        if (text.length > 8000) { toast('这段文字较长，请保留8000字以内。'); return; }
        State.saving = true; updateSaveButton();
        const record = { id: window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2), time: new Date().toISOString(), text, image: State.image, ai: '', aiStatus: 'queued', error: '' };
        try {
            await persist(record);
            clearDraft(); closeInputPanel(); renderTimeline(); toast('已保存在此设备，正在整理文字。');
            void runAI(record.id);
        } catch (error) { notice(storageMessage(error)); toast(storageMessage(error)); }
        finally { State.saving = false; updateSaveButton(); }
    }
    async function runAI(id) {
        if (running.has(id)) return;
        const record = State.records.find(item => item.id === id);
        if (!record) return;
        running.add(id);
        try {
            await persist({ ...record, aiStatus: 'generating', error: '', errorCode: '', requestId: '' }); renderTimeline();
            let content;
            try { content = await Api.generate(record); }
            catch (error) {
                await persist({ ...record, aiStatus: 'failed', error: error.message, errorCode: error.code || '', requestId: error.requestId || '' });
                return;
            }
            await persist({ ...record, ai: content, aiStatus: 'done', error: '', errorCode: '', requestId: '' });
        } catch (error) {
            notice('原始记录已保存，但整理结果暂未写入。请导出备份并检查设备存储。');
            const index = State.records.findIndex(item => item.id === id);
            if (index !== -1) State.records[index] = { ...State.records[index], aiStatus: 'failed', error: '整理状态未保存，可稍后重试。' };
        } finally { running.delete(id); renderTimeline(); }
    }

    // 模块 8：原始备份与启动。旧数据不清除，迁移只执行一次。
    function exportData() {
        let legacyRaw = null;
        try { legacyRaw = localStorage.getItem('shijian_history'); } catch (_) { /* 新存储仍可导出。 */ }
        const payload = { version: VERSION, exportedAt: new Date().toISOString(), records: State.records, legacyRaw };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const link = node('a'); link.href = url;
        link.download = 'shijian-backup-' + dateKey(new Date().toISOString()) + '.json';
        document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async function init() {
        const d = new Date(); el('currentMonth').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月`;
        el('imageInput').addEventListener('change', onImageChange);
        el('removeImageButton').addEventListener('click', () => { State.imageVersion += 1; State.imageLoading = false; State.image = null; el('imagePreview').hidden = true; el('imagePreviewImage').removeAttribute('src'); updateSaveButton(); });
        el('exportButton').addEventListener('click', exportData);
        document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeModal(); closeInputPanel(); } });
        const viewport = window.visualViewport;
        if (viewport) {
            const resize = () => document.documentElement.style.setProperty('--keyboard-inset', Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) + 'px');
            viewport.addEventListener('resize', resize); viewport.addEventListener('scroll', resize);
        }
        try {
            const loaded = await Storage.init(); State.records = loaded.records;
            for (const record of [...State.records]) {
                if (record.aiStatus === 'generating' || record.aiStatus === 'queued') await persist({ ...record, aiStatus: 'failed', error: '上次整理未完成，可重试。' });
            }
            State.ready = true; notice(loaded.warning);
        } catch (error) { notice('设备存储未能打开，暂未保存任何新输入。请保留页面内容，并检查浏览器存储设置。'); }
        renderTimeline(); updateSaveButton();
    }
    // 保留原HTML的轻量入口；实际职责分别由以上模块实现。
    Object.assign(window, { openInputPanel, closeInputPanel, saveRecord, closeModal, exportData });
    window.ShijianApp = Object.freeze({ version: VERSION });
    void init();
})();

</script>
</body>
</html>
